[workspace]
resolver = "3"

[package]
name = "penna-storybook"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 AND OFL-1.1"
rust-version = "1.99"
description = "Every penna widget in its states on one web page, and the harness apps build their own storybook on"
repository = "https://github.com/autistic-computer/penna"
publish = false

[features]
default = ["editor"]
editor = ["penna/editor"]
page = []
syntax-highlighting = ["penna/tree-sitter"]

[dependencies]
serde_json = "1"
web-time = "1"
ala = { git = "https://github.com/autistic-computer/ala", branch = "main" }
penna = { path = ".." }

[dev-dependencies]
ala = { git = "https://github.com/autistic-computer/ala", branch = "main", features = ["test-support"] }

[target.'cfg(target_family = "wasm")'.dependencies]
ala-platform = { git = "https://github.com/autistic-computer/ala", branch = "main", default-features = false }
wasm-bindgen = "0.2.128"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unused_self = "allow"

[profile.dev]
debug = 1

[profile.dev.package]
"*" = { opt-level = 2 }
taffy = { opt-level = 3 }
ala = { opt-level = 3 }
penna = { opt-level = 0 }
ala-macros = { opt-level = 2 }
ala-platform = { opt-level = 2 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
