<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Button</title>
    <link rel="stylesheet" href="../../../../web/penna.css" />
    <link rel="stylesheet" href="../../../../web/story.css" />
    <link rel="stylesheet" href="../../../../src/components/button/button.css" />
    <link rel="stylesheet" href="../../../../src/components/tooltip/tooltip.css" />
    <link rel="stylesheet" href="page.css" />
    <script src="../../../../web/kit.js" data-tokens="../../../../web/tokens/"></script>
    <script src="../../../../web/story.js" defer></script>
    <script src="../../../../src/components/button/button.js" defer></script>
    <script src="../../../../src/components/tooltip/tooltip.js" defer></script>
  </head>
  <body>
    <section data-section="variants">
      <div class="story-row">
        <button class="penna-button" data-penna="button" data-tone="primary" data-prominent data-id="variant-Primary"><span class="penna-label" data-penna-text>Primary</span></button>
        <button class="penna-button" data-penna="button" data-id="variant-Secondary"><span class="penna-label" data-penna-text>Secondary</span></button>
        <button class="penna-button" data-penna="button.quiet" data-id="variant-Ghost"><span class="penna-label" data-penna-text>Ghost</span></button>
        <button class="penna-button" data-penna="button" data-tone="danger" data-id="variant-Danger"><span class="penna-label" data-penna-text>Danger</span></button>
        <button class="penna-button" data-penna="button" data-tone="success" data-id="variant-Success"><span class="penna-label" data-penna-text>Success</span></button>
        <button class="penna-button" data-penna="button" data-tone="warning" data-id="variant-Warning"><span class="penna-label" data-penna-text>Warning</span></button>
        <a class="penna-button" data-variant="link" href="#" data-id="variant-Link"><span class="penna-label" data-penna-text>Link</span></a>
        <button class="penna-button" data-variant="text" data-id="variant-Text"><span class="penna-label" data-penna-text>Text</span></button>
      </div>
    </section>

    <section data-section="sizes">
      <div class="story-states">
        <div class="story-state">
          <div class="story-label">label</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button" data-size="xsmall" data-id="size-xs"><span class="penna-label" data-penna-text>XSmall</span></button>
            <button class="penna-button" data-penna="button" data-size="small" data-id="size-sm"><span class="penna-label" data-penna-text>Small</span></button>
            <button class="penna-button" data-penna="button" data-id="size-md"><span class="penna-label" data-penna-text>Medium</span></button>
            <button class="penna-button" data-penna="button" data-size="large" data-id="size-lg"><span class="penna-label" data-penna-text>Large</span></button>
            <button class="penna-button" data-penna="button" data-size="xlarge" data-id="size-xl"><span class="penna-label" data-penna-text>XLarge</span></button>
            <button class="penna-button" data-penna="button" data-size="touch" data-id="size-touch"><span class="penna-label" data-penna-text>Touch</span></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">icon</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button" data-shape="icon" data-size="xsmall" aria-label="Notifications" data-tooltip="Notifications" data-id="icon-xs"><i data-icon="bell"></i></button>
            <button class="penna-button" data-penna="button" data-shape="icon" data-size="small" aria-label="Notifications" data-tooltip="Notifications" data-id="icon-sm"><i data-icon="bell"></i></button>
            <button class="penna-button" data-penna="button" data-shape="icon" aria-label="Notifications" data-tooltip="Notifications" data-id="icon-md"><i data-icon="bell"></i></button>
            <button class="penna-button" data-penna="button" data-shape="icon" data-size="large" aria-label="Notifications" data-tooltip="Notifications" data-id="icon-lg"><i data-icon="bell"></i></button>
            <button class="penna-button" data-penna="button" data-shape="icon" data-size="xlarge" aria-label="Notifications" data-tooltip="Notifications" data-id="icon-xl"><i data-icon="bell"></i></button>
            <button class="penna-button" data-penna="button" data-shape="icon" data-size="touch" aria-label="Notifications" data-tooltip="Notifications" data-id="icon-touch"><i data-icon="bell"></i></button>
            <button class="penna-button" data-penna="icon-button" data-shape="compact-icon" aria-label="More" data-tooltip="More" data-id="icon-compact"><i data-icon="ellipsis"></i></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">icon and label</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button" data-size="xsmall" data-id="icon-label-xs"><i data-icon="bell"></i><span class="penna-label" data-penna-text>XSmall</span></button>
            <button class="penna-button" data-penna="button" data-size="small" data-id="icon-label-sm"><i data-icon="bell"></i><span class="penna-label" data-penna-text>Small</span></button>
            <button class="penna-button" data-penna="button" data-id="icon-label-md"><i data-icon="bell"></i><span class="penna-label" data-penna-text>Medium</span></button>
            <button class="penna-button" data-penna="button" data-size="large" data-id="icon-label-lg"><i data-icon="bell"></i><span class="penna-label" data-penna-text>Large</span></button>
            <button class="penna-button" data-penna="button" data-size="xlarge" data-id="icon-label-xl"><i data-icon="bell"></i><span class="penna-label" data-penna-text>XLarge</span></button>
            <button class="penna-button" data-penna="button" data-size="touch" data-id="icon-label-touch"><i data-icon="bell"></i><span class="penna-label" data-penna-text>Touch</span></button>
          </div>
        </div>
      </div>
    </section>

    <section data-section="states">
      <div class="story-states" data-columns style="--columns: 2">
        <div class="story-state">
          <div class="story-label">disabled</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button" data-tone="primary" data-prominent disabled data-id="disabled-Primary"><span class="penna-label" data-penna-text>Primary</span></button>
            <button class="penna-button" data-penna="button" disabled data-id="disabled-Secondary"><span class="penna-label" data-penna-text>Secondary</span></button>
            <button class="penna-button" data-penna="button.quiet" disabled data-id="disabled-Ghost"><span class="penna-label" data-penna-text>Ghost</span></button>
            <button class="penna-button" data-penna="button" data-tone="danger" disabled data-id="disabled-Danger"><span class="penna-label" data-penna-text>Danger</span></button>
            <button class="penna-button" data-penna="button" data-tone="success" disabled data-id="disabled-Success"><span class="penna-label" data-penna-text>Success</span></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">selected</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button.quiet" data-state="current" data-id="selected-ghost"><span class="penna-label" data-penna-text>Ghost</span></button>
            <button class="penna-button" data-penna="button" data-state="current" data-id="selected-default"><span class="penna-label" data-penna-text>Default</span></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">loading</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button" data-loading data-id="loading-default"><span class="penna-label" data-penna-text>Saving</span></button>
            <button class="penna-button" data-penna="button" data-tone="primary" data-prominent data-loading data-id="loading-accent"><span class="penna-label" data-penna-text>Sending</span></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">icon and label</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button" data-id="copy"><i data-icon="copy"></i><span class="penna-label" data-penna-text>Copy</span></button>
            <button class="penna-button" data-penna="button.quiet" data-id="open"><i data-icon="external-link"></i><span class="penna-label" data-penna-text>Open</span></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">dropdown caret</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button" data-caret data-id="caret"><span class="penna-label" data-penna-text>Model</span><i class="penna-caret" data-icon="chevron-down"></i></button>
            <button class="penna-button" data-penna="button.quiet" data-caret data-id="caret-ghost"><span class="penna-label" data-penna-text>Branch</span><i class="penna-caret" data-icon="chevron-down"></i></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">outline</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button.outline" data-id="outline"><span class="penna-label" data-penna-text>Outline</span></button>
            <button class="penna-button" data-penna="button.outline" data-tone="danger" data-id="outline-danger"><span class="penna-label" data-penna-text>Delete</span></button>
          </div>
        </div>
      </div>
    </section>

    <section data-section="custom-and-shapes">
      <div class="story-states" data-columns style="--columns: 2">
        <div class="story-state">
          <div class="story-label">flat</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button" data-flat data-id="flat-default"><span class="penna-label" data-penna-text>Default</span></button>
            <button class="penna-button" data-penna="button.quiet" data-flat data-id="flat-ghost"><span class="penna-label" data-penna-text>Ghost</span></button>
            <button class="penna-button" data-penna="button" data-flat data-id="flat-secondary"><span class="penna-label" data-penna-text>Secondary</span></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">compact</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button" data-compact data-id="compact-sm"><span class="penna-label" data-penna-text>Run</span></button>
            <button class="penna-button" data-penna="button" data-compact data-id="compact-md"><span class="penna-label" data-penna-text>Run</span></button>
            <button class="penna-button" data-penna="button" data-id="normal-md"><span class="penna-label" data-penna-text>Run</span></button>
            <button class="penna-button" data-penna="icon-button" data-shape="compact-icon" aria-label="Add" data-tooltip="Add" data-id="compact-icon"><i data-icon="plus"></i></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">rounded</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button" style="--penna-r: 0px; --penna-k: var(--penna-style-k)" data-id="rounded-0"><span class="penna-label" data-penna-text>Square</span></button>
            <button class="penna-button" data-penna="button" data-id="rounded-theme"><span class="penna-label" data-penna-text>Theme radius</span></button>
            <button class="penna-button" data-penna="button" style="--penna-r: 999px; --penna-k: var(--penna-style-k)" data-id="rounded-pill"><span class="penna-label" data-penna-text>Pill</span></button>
            <button class="penna-button" data-penna="button" data-shape="icon" style="--penna-r: 999px; --penna-k: var(--penna-style-k)" data-id="rounded-icon"><i data-icon="plus"></i></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">loading with an icon</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button" data-loading data-id="loading-icon"><i data-icon="loader"></i><span class="penna-label" data-penna-text>Copying</span></button>
            <button class="penna-button" data-penna="button" data-shape="icon" data-loading data-id="loading-icon-only"><i data-icon="loader"></i></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">children</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button" data-id="children"><span class="penna-group"><span class="penna-label" data-penna-text>Branch</span><span class="penna-label penna-aside" data-penna-text>main</span></span></button>
          </div>
        </div>
      </div>
    </section>

    <section data-section="looks">
      <div class="story-states" data-columns="3">
        <div class="story-state">
          <div class="story-label">icon</div>
          <div class="story-row">
            <button class="penna-button" data-penna="icon-button" data-shape="icon" aria-label="icon" data-tooltip="icon" data-id="look-icon-rest"><i data-icon="plus"></i></button>
            <button class="penna-button" data-penna="icon-button" data-shape="icon" data-state="current" aria-label="icon" data-tooltip="icon" data-id="look-icon-selected"><i data-icon="plus"></i></button>
            <button class="penna-button" data-penna="icon-button" data-shape="icon" disabled aria-label="icon" data-tooltip="icon" data-id="look-icon-disabled"><i data-icon="plus"></i></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">quiet</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button.quiet" data-id="look-quiet-rest"><span class="penna-label" data-penna-text>Connect</span></button>
            <button class="penna-button" data-penna="button.quiet" data-state="current" data-id="look-quiet-selected"><span class="penna-label" data-penna-text>Connect</span></button>
            <button class="penna-button" data-penna="button.quiet" disabled data-id="look-quiet-disabled"><span class="penna-label" data-penna-text>Connect</span></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">flat</div>
          <div class="story-row">
            <button class="penna-button" data-penna="icon-button.flat" data-shape="icon" aria-label="flat" data-tooltip="flat" data-id="look-flat-rest"><i data-icon="plus"></i></button>
            <button class="penna-button" data-penna="icon-button.flat" data-shape="icon" data-state="current" aria-label="flat" data-tooltip="flat" data-id="look-flat-selected"><i data-icon="plus"></i></button>
            <button class="penna-button" data-penna="icon-button.flat" data-shape="icon" disabled aria-label="flat" data-tooltip="flat" data-id="look-flat-disabled"><i data-icon="plus"></i></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">chrome</div>
          <div class="story-row">
            <button class="penna-button" data-penna="chrome.button" data-shape="icon" aria-label="chrome" data-tooltip="chrome" data-id="look-chrome-rest"><i data-icon="plus"></i></button>
            <button class="penna-button" data-penna="chrome.button" data-shape="icon" data-state="current" aria-label="chrome" data-tooltip="chrome" data-id="look-chrome-selected"><i data-icon="plus"></i></button>
            <button class="penna-button" data-penna="chrome.button" data-shape="icon" disabled aria-label="chrome" data-tooltip="chrome" data-id="look-chrome-disabled"><i data-icon="plus"></i></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">bar</div>
          <div class="story-row">
            <button class="penna-button" data-penna="icon-button.bar" data-shape="icon" aria-label="bar" data-tooltip="bar" data-id="look-bar-rest"><i data-icon="plus"></i></button>
            <button class="penna-button" data-penna="icon-button.bar" data-shape="icon" data-state="current" aria-label="bar" data-tooltip="bar" data-id="look-bar-selected"><i data-icon="plus"></i></button>
            <button class="penna-button" data-penna="icon-button.bar" data-shape="icon" disabled aria-label="bar" data-tooltip="bar" data-id="look-bar-disabled"><i data-icon="plus"></i></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">toggle</div>
          <div class="story-row">
            <button class="penna-button" data-penna="icon-button.toggle" data-shape="icon" aria-label="toggle" data-tooltip="toggle" data-id="look-toggle-rest"><i data-icon="plus"></i></button>
            <button class="penna-button" data-penna="icon-button.toggle" data-shape="icon" data-state="current" aria-label="toggle" data-tooltip="toggle" data-id="look-toggle-selected"><i data-icon="plus"></i></button>
            <button class="penna-button" data-penna="icon-button.toggle" data-shape="icon" disabled aria-label="toggle" data-tooltip="toggle" data-id="look-toggle-disabled"><i data-icon="plus"></i></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">row icon</div>
          <div class="story-row">
            <button class="penna-button" data-penna="icon-button.row" data-shape="icon" aria-label="row icon" data-tooltip="row icon" data-id="look-row icon-rest"><i data-icon="plus"></i></button>
            <button class="penna-button" data-penna="icon-button.row" data-shape="icon" data-state="current" aria-label="row icon" data-tooltip="row icon" data-id="look-row icon-selected"><i data-icon="plus"></i></button>
            <button class="penna-button" data-penna="icon-button.row" data-shape="icon" disabled aria-label="row icon" data-tooltip="row icon" data-id="look-row icon-disabled"><i data-icon="plus"></i></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">floating</div>
          <div class="story-row">
            <button class="penna-button" data-penna="icon-button.floating" data-shape="icon" aria-label="floating" data-tooltip="floating" data-id="look-floating-rest"><i data-icon="plus"></i></button>
            <button class="penna-button" data-penna="icon-button.floating" data-shape="icon" data-state="current" aria-label="floating" data-tooltip="floating" data-id="look-floating-selected"><i data-icon="plus"></i></button>
            <button class="penna-button" data-penna="icon-button.floating" data-shape="icon" disabled aria-label="floating" data-tooltip="floating" data-id="look-floating-disabled"><i data-icon="plus"></i></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">row</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button.row" data-id="look-row-rest"><span class="penna-label" data-penna-text>Connect</span></button>
            <button class="penna-button" data-penna="button.row" data-state="current" data-id="look-row-selected"><span class="penna-label" data-penna-text>Connect</span></button>
            <button class="penna-button" data-penna="button.row" disabled data-id="look-row-disabled"><span class="penna-label" data-penna-text>Connect</span></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">send</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button.send" data-shape="icon" aria-label="send" data-tooltip="send" data-id="look-send-rest"><i data-icon="plus"></i></button>
            <button class="penna-button" data-penna="button.send" data-shape="icon" data-state="current" aria-label="send" data-tooltip="send" data-id="look-send-selected"><i data-icon="plus"></i></button>
            <button class="penna-button" data-penna="button.send" data-shape="icon" disabled aria-label="send" data-tooltip="send" data-id="look-send-disabled"><i data-icon="plus"></i></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">floating chip</div>
          <div class="story-row">
            <button class="penna-button" data-penna="chip.floating" data-id="look-floating chip-rest"><span class="penna-label" data-penna-text>Connect</span></button>
            <button class="penna-button" data-penna="chip.floating" data-state="current" data-id="look-floating chip-selected"><span class="penna-label" data-penna-text>Connect</span></button>
            <button class="penna-button" data-penna="chip.floating" disabled data-id="look-floating chip-disabled"><span class="penna-label" data-penna-text>Connect</span></button>
          </div>
        </div>
        <div class="story-state">
          <div class="story-label">tray</div>
          <div class="story-row">
            <button class="penna-button" data-penna="tab.tray" data-id="look-tray-rest"><span class="penna-label" data-penna-text>Connect</span></button>
            <button class="penna-button" data-penna="tab.tray" data-state="current" data-id="look-tray-selected"><span class="penna-label" data-penna-text>Connect</span></button>
            <button class="penna-button" data-penna="tab.tray" disabled data-id="look-tray-disabled"><span class="penna-label" data-penna-text>Connect</span></button>
          </div>
        </div>
      </div>
    </section>

    <section data-section="hovered">
      <div class="story-states">
        <div class="story-state">
          <div class="story-label">hovered, resting</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button" data-state="hover" data-id="pointer-target"><span class="penna-label" data-penna-text>Secondary</span></button>
            <button class="penna-button" data-penna="button" data-id="pointer-rest"><span class="penna-label" data-penna-text>Secondary</span></button>
          </div>
        </div>
      </div>
    </section>

    <section data-section="pressed">
      <div class="story-states">
        <div class="story-state">
          <div class="story-label">pressed, resting</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button" data-tone="primary" data-prominent data-state="hover active" data-id="pointer-target"><span class="penna-label" data-penna-text>Primary</span></button>
            <button class="penna-button" data-penna="button" data-tone="primary" data-prominent data-id="pointer-rest"><span class="penna-label" data-penna-text>Primary</span></button>
          </div>
        </div>
      </div>
    </section>

    <section data-section="focused">
      <div class="story-states">
        <div class="story-state">
          <div class="story-label">focused, resting</div>
          <div class="story-row">
            <button class="penna-button" data-penna="button" data-state="focused" data-id="pointer-target"><span class="penna-label" data-penna-text>Focused</span></button>
            <button class="penna-button" data-penna="button" data-id="pointer-rest"><span class="penna-label" data-penna-text>Focused</span></button>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
