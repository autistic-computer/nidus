<!-- @dsCard group="Layout" height=304 width=960 subtitle="A grid of equal tiles that fills the width" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tiles</title>
<style>
  .ti-grid { --pd-tile: 140px; width: 720px; }
  .ti-tile { height: 88px; border-radius: 16px; background: color-mix(in srgb, var(--fg) 6%, var(--bg)); display: flex; align-items: flex-end; padding: var(--space-8) var(--space-12); }
</style>
</head>
<body>
<div id="root" class="pd-frame body" data-redline>
  <div class="pd-tools small">
    <label class="pd-toggle"><input type="checkbox" id="show-spacing" data-redline-toggle checked> Show spacing</label>
    <span class="pd-key" data-kind="gap">gap</span>
    <span class="pd-key" data-kind="inset">inset</span>
    <span class="pd-muted">Hover anything, or a token, to see it.</span>
    <div class="pd-tokens" data-redline-tokens></div>
  </div>

  <div class="pd-tiles ti-grid" data-gap="related">
    <div class="ti-tile small">main</div>
    <div class="ti-tile small">nidus</div>
    <div class="ti-tile small">penna docs</div>
    <div class="ti-tile small">ala build</div>
    <div class="ti-tile small">notes</div>
    <div class="ti-tile small">storybook</div>
    <div class="ti-tile small">parity</div>
  </div>
</div>
</body>
</html>
