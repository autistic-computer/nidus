<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code editor</title>
    <link rel="stylesheet" href="../../web/penna.css" />
    <link rel="stylesheet" href="../../web/story.css" />
    <link rel="stylesheet" href="code_editor.css" />

  <body>
    <script type="text/plain" id="ce-rust">
use std::collections::HashMap;

/// One persistent session: named windows, each a tree of panes.
pub struct Session {
    name: String,
    windows: Vec<Window>,
    options: HashMap<&'static str, String>,
}

impl Session {
    pub fn new(name: impl Into<String>) -> Self {
        Self { name: name.into(), windows: Vec::new(), options: HashMap::new() }
    }

    pub fn rename(&mut self, name: &str) -> bool {
        let changed = self.name != name;
        self.name = name.to_owned();
        changed
    }
}
</script>
    <script type="text/plain" id="ce-json">
{
  "theme": "nord",
  "font": { "family": "Lilex", "size": 13 },
  "status": { "left": "%s", "interval": 5 },
  "panes": [1, 2, 3],
  "motion": false,
  "shell": null
}
</script>
    <script type="text/plain" id="ce-prose">
Soft wrap folds long lines at the editor's edge instead of scrolling sideways, so a paragraph like this one reads as several visual rows while staying one buffer line.
The second buffer line is short.
The third one is also long enough to wrap once the rail is hidden and the editor is narrow.
</script>
    <section data-section="languages">
      <div class="story-states" data-columns style="--columns: 2">
        <div class="story-state">
          <div class="story-label">rust</div>
          <div class="ce-frame"><div class="penna-code-editor" data-penna="field.multiline" data-source="ce-rust" data-language="rust"></div></div>
        </div>
        <div class="story-state">
          <div class="story-label">json</div>
          <div class="ce-frame"><div class="penna-code-editor" data-penna="field.multiline" data-source="ce-json" data-language="json"></div></div>
        </div>
      </div>
    </section>
    <section data-section="rails">
      <div class="story-states" data-columns style="--columns: 2">
        <div class="story-state">
          <div class="story-label">relative line numbers</div>
          <div class="ce-frame"><div class="penna-code-editor" data-penna="field.multiline" data-source="ce-rust" data-language="rust" data-line-numbers="relative" data-selection="260"></div></div>
        </div>
        <div class="story-state">
          <div class="story-label">no line numbers, soft wrap</div>
          <div class="ce-frame"><div class="penna-code-editor" data-penna="field.multiline" data-source="ce-prose" data-language="text" data-line-numbers="off" data-wrap></div></div>
        </div>
      </div>
    </section>
    <section data-section="vim-visual">
      <div class="story-states" data-columns style="--columns: 2">
        <div class="story-state">
          <div class="story-label">vim, visual</div>
          <div class="ce-frame"><div class="penna-code-editor" data-penna="field.multiline" data-source="ce-rust" data-language="rust" data-vim data-vim-visual="122" data-selection="124" data-scroll="-2,-4"></div></div>
        </div>
        <div class="story-state">
          <div class="story-label">vim off</div>
          <div class="ce-frame"><div class="penna-code-editor" data-penna="field.multiline" data-source="ce-json" data-language="json"></div></div>
        </div>
      </div>
    </section>
    <section data-section="scrolled-sideways">
      <div class="story-states" data-columns style="--columns: 2">
        <div class="story-state">
          <div class="story-label">cursor at the end of line 3</div>
          <div class="ce-frame"><div class="penna-code-editor" data-penna="field.multiline" data-source="ce-rust" data-language="rust" data-selection="96"></div></div>
        </div>
        <div class="story-state">
          <div class="story-label">soft wrap on</div>
          <div class="ce-frame"><div class="penna-code-editor" data-penna="field.multiline" data-source="ce-rust" data-language="rust" data-wrap></div></div>
        </div>
      </div>
    </section>
    <section data-section="states">
      <div class="story-states" data-columns style="--columns: 2">
        <div class="story-state">
          <div class="story-label">focused, selection</div>
          <div class="ce-frame"><div class="penna-code-editor" data-penna="field.multiline" data-source="ce-json" data-language="json" data-selection="4,11" autofocus></div></div>
        </div>
        <div class="story-state">
          <div class="story-label">disabled</div>
          <div class="ce-frame"><div class="penna-code-editor" data-penna="field.multiline" data-source="ce-json" data-language="json" aria-disabled="true"></div></div>
        </div>
      </div>
    </section>
  </body>
