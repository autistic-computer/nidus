name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust build toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy
      - name: Rust
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows app
        run: ./scripts/build-windows.ps1
      - name: Open the app
        run: ./scripts/check-windows-app.ps1 -App windows/dist/Nid.App.exe -Out target/app-check/built
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Replace the zflow app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $check = New-Item -ItemType Directory -Force target/app-check/updated
          gh release download v0.7.0 --repo $env:GITHUB_REPOSITORY --pattern zflow-windows-x86_64-Setup.exe --dir $check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $old = Join-Path $env:LOCALAPPDATA 'Zflow.App'
          $setup = Start-Process (Join-Path $check 'zflow-windows-x86_64-Setup.exe') -ArgumentList '--silent' -PassThru
          if (-not $setup.WaitForExit(300000)) { throw 'The zflow installer did not finish' }
          if (-not (Test-Path (Join-Path $old 'current/Zflow.App.exe'))) { throw 'The zflow release did not install' }
          Start-Sleep -Seconds 10
          ./scripts/package-windows.ps1 -PackVersion 0.7.1
          ./scripts/install-windows.ps1 -SourceDirectory target/windows-release -NoLaunch
          $root = Join-Path $env:LOCALAPPDATA 'Nid.App'
          $installed = Get-Content -Raw (Join-Path $root 'current/sq.version')
          if ($installed -notmatch '<version>0\.7\.1</version>') { $installed; throw 'Nidus did not install' }
          if (-not (Test-Path (Join-Path $root 'current/nid.exe'))) { throw 'The install left out the engine' }
          if (Test-Path (Join-Path $old 'current')) { throw 'The zflow app is still installed' }
          ./scripts/check-windows-app.ps1 -App (Join-Path $root 'current/Nid.App.exe') -Out $check
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'nid/nid.toml'))) { throw 'The zflow configuration did not move' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'zflow')) { throw 'The zflow configuration stayed behind' }
      - name: Upload app check
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nid-app-check-windows
          path: target/app-check/
          if-no-files-found: ignore
      - name: Windows script checks
        run: |
          pwsh -NoProfile -File windows/Nid.UpdateTests/Install.Tests.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File windows/Nid.UpdateTests/Build.Tests.ps1
      - name: Upload Windows preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nid-windows-x64
          path: windows/dist/
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust build toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libpipewire-0.3-dev libspa-0.2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libfontconfig-dev libfreetype-dev
      - name: Rust
        run: |
          cargo fmt --all --check
          cargo build --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: GNOME extension
        run: |
          node tests/gnome_desktop_test.mjs
          node tests/gnome_panel_test.mjs
          node tests/gnome_loader_test.mjs
      - name: Installer
        run: python3 tests/install_test.py
      - name: Release commands
        run: |
          python3 tests/release_test.py
          python3 tests/macos_updates_test.py
      - name: Shell scripts
        run: |
          shellcheck -x install.sh scripts/*.sh packaging/linux/*.sh packaging/system-sleep/nid \
            debian/nid.postinst debian/nid.postrm debian/nid.preinst debian/nid.prerm tests/deb_lifecycle.sh

  linux-arm:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust build toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libpipewire-0.3-dev libspa-0.2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libfontconfig-dev libfreetype-dev
      - name: Rust
        run: cargo test --locked --all-targets

  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust build toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - name: Rust
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: C harnesses
        run: |
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p target/debug
          xcrun --sdk macosx clang -isysroot "$sdk" -std=c11 -O2 -Wall -Wextra -Werror \
            tests/macos_awdl_helper_test.c -o target/debug/macos-awdl-helper-test
          ./target/debug/macos-awdl-helper-test
          xcrun --sdk macosx clang -isysroot "$sdk" -std=c11 -O2 -Wall -Wextra -Werror \
            tests/macos_capture_test.c -framework ApplicationServices -framework CoreFoundation \
            -o target/debug/macos-capture-test
          ./target/debug/macos-capture-test
          xcrun --sdk macosx clang -isysroot "$sdk" -std=c11 -O2 -Wall -Wextra -Werror \
            tests/macos_inject_test.c -framework ApplicationServices -framework CoreFoundation \
            -framework IOKit -o target/debug/macos-inject-test
          ./target/debug/macos-inject-test
          xcrun --sdk macosx clang -isysroot "$sdk" -fobjc-arc -O2 -Wall -Wextra -Werror \
            tests/macos_media_test.m -framework AppKit -framework ApplicationServices \
            -o target/debug/macos-media-test
          MTC_CRASH_ON_REPORT=1 \
            DYLD_INSERT_LIBRARIES="$(xcode-select -p)/usr/lib/libMainThreadChecker.dylib" \
            ./target/debug/macos-media-test
          xcrun --sdk macosx clang -isysroot "$sdk" -fobjc-arc -O2 -Wall -Wextra -Werror \
            tests/macos_pasteboard_test.m -framework AppKit -framework CoreGraphics \
            -framework ImageIO -o target/debug/macos-pasteboard-test
          MTC_CRASH_ON_REPORT=1 \
            DYLD_INSERT_LIBRARIES="$(xcode-select -p)/usr/lib/libMainThreadChecker.dylib" \
            ./target/debug/macos-pasteboard-test
      - name: App bundle
        run: ./scripts/build-macos-app.sh --debug
      - name: Open the app
        run: |
          mkdir -p target/app-check
          cd target/app-check
          cat > windows.swift <<'SWIFT'
          import CoreGraphics
          let pid = Int(CommandLine.arguments[1])!
          let all = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]] ?? []
          let mine = all.filter { $0[kCGWindowOwnerPID as String] as? Int == pid }
          for window in mine { print(window[kCGWindowBounds as String] ?? "") }
          let big = mine.contains { (($0[kCGWindowBounds as String] as? [String: Any])?["Width"] as? Double ?? 0) >= 700 }
          if !big { print("no Nidus window on screen"); exit(1) }
          SWIFT
          RUST_LOG=warn,nid=debug ../debug/Nidus.app/Contents/MacOS/nid-app \
            --config "$PWD/config/config.toml" --show-settings 2> app.log &
          pid=$!
          sleep 20
          screencapture -x macos.png || true
          kill -0 "$pid" || { cat app.log; exit 1; }
          swift windows.swift "$pid" || { cat app.log; exit 1; }
          kill "$pid"
          wait "$pid" || true
          cat app.log
          ! grep -q panicked app.log
      - name: Upload app check
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nid-app-check-macos
          path: target/app-check/
          if-no-files-found: ignore
      - name: Installer
        run: python3 tests/install_test.py
      - name: Notarization script
        run: python3 tests/macos_notarization_test.py
      - name: Update packaging
        run: python3 tests/macos_updates_test.py
