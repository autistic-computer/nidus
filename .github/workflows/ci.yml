name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.97.1
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust build toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy
      - name: Rust
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows app
        run: ./scripts/build-windows.ps1
      # Opens the built app on a fresh configuration: it must stay up with its
      # window, start the engine and quit when asked. The picture and the log
      # are kept with the run.
      - name: Open the app
        run: |
          $check = New-Item -ItemType Directory -Force target/app-check
          $config = Join-Path $check 'config/config.toml'
          $env:RUST_LOG = 'warn,zflow=debug'
          $app = Start-Process windows/dist/Zflow.App.exe -PassThru `
            -ArgumentList '--config', "`"$config`"", '--show-settings' `
            -RedirectStandardError (Join-Path $check 'app.log')
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $picture = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($picture).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $picture.Save((Join-Path $check 'windows.png'))
          $app.Refresh()
          $alive = -not $app.HasExited
          $title = if ($alive) { $app.MainWindowTitle }
          $engine = Get-Process zflow -ErrorAction SilentlyContinue
          "window: '$title', engine: $($engine.Id)"
          & windows/dist/Zflow.App.exe --quit
          $quit = $app.WaitForExit(15000)
          if (-not $quit) { Stop-Process -Id $app.Id -Force }
          Get-Content (Join-Path $check 'app.log')
          if (-not $alive) { throw "zflow-app exited early with $($app.ExitCode)" }
          if ($title -ne 'zflow') { throw 'zflow-app showed no window' }
          if (-not $engine) { throw 'zflow-app did not start the engine' }
          if (-not $quit) { throw 'zflow-app did not quit when asked' }
          if (Select-String -Quiet panicked (Join-Path $check 'app.log')) { throw 'zflow-app panicked' }
      - name: Upload app check
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zflow-app-check-windows
          path: target/app-check/
          if-no-files-found: ignore
      - name: Windows script checks
        run: |
          pwsh -NoProfile -File windows/Zflow.UpdateTests/Install.Tests.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File windows/Zflow.UpdateTests/Build.Tests.ps1
      - name: Upload Windows preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zflow-windows-x64
          path: windows/dist/
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust build toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Build libraries
        run: |
          sudo apt-get update
          # PipeWire for the lens; the rest for the app's window.
          sudo apt-get install -y pkg-config libclang-dev libpipewire-0.3-dev libspa-0.2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libfontconfig-dev libfreetype-dev
      - name: Rust
        run: |
          cargo fmt --all --check
          # Without dev-dependencies, so their features can't hide a missing one.
          cargo build --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: GNOME extension
        run: |
          node tests/gnome_desktop_test.mjs
          node tests/gnome_panel_test.mjs
          node tests/gnome_loader_test.mjs
      - name: Installer
        run: python3 tests/install_test.py
      - name: Release commands
        run: |
          python3 tests/release_test.py
          python3 tests/macos_updates_test.py
      - name: Shell scripts
        run: |
          shellcheck -x install.sh scripts/*.sh packaging/linux/*.sh packaging/system-sleep/zflow \
            debian/zflow.postinst debian/zflow.postrm debian/zflow.preinst debian/zflow.prerm tests/deb_lifecycle.sh

  # The release builds Linux on arm64 too, so its tests run there as well.
  linux-arm:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust build toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build libraries
        run: |
          sudo apt-get update
          # PipeWire for the lens; the rest for the app's window.
          sudo apt-get install -y pkg-config libclang-dev libpipewire-0.3-dev libspa-0.2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libfontconfig-dev libfreetype-dev
      - name: Rust
        run: cargo test --locked --all-targets

  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust build toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - name: Rust
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: C harnesses
        run: |
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p target/debug
          xcrun --sdk macosx clang -isysroot "$sdk" -std=c11 -O2 -Wall -Wextra -Werror \
            tests/macos_awdl_helper_test.c -o target/debug/macos-awdl-helper-test
          ./target/debug/macos-awdl-helper-test
          xcrun --sdk macosx clang -isysroot "$sdk" -std=c11 -O2 -Wall -Wextra -Werror \
            tests/macos_capture_test.c -framework ApplicationServices -framework CoreFoundation \
            -o target/debug/macos-capture-test
          ./target/debug/macos-capture-test
          xcrun --sdk macosx clang -isysroot "$sdk" -std=c11 -O2 -Wall -Wextra -Werror \
            tests/macos_inject_test.c -framework ApplicationServices -framework CoreFoundation \
            -framework IOKit -o target/debug/macos-inject-test
          ./target/debug/macos-inject-test
          xcrun --sdk macosx clang -isysroot "$sdk" -fobjc-arc -O2 -Wall -Wextra -Werror \
            tests/macos_media_test.m -framework AppKit -framework ApplicationServices \
            -o target/debug/macos-media-test
          # The Main Thread Checker fails the run if AppKit wants the main thread.
          MTC_CRASH_ON_REPORT=1 \
            DYLD_INSERT_LIBRARIES="$(xcode-select -p)/usr/lib/libMainThreadChecker.dylib" \
            ./target/debug/macos-media-test
          # A uniquely named pasteboard, so the run leaves the clipboard alone.
          xcrun --sdk macosx clang -isysroot "$sdk" -fobjc-arc -O2 -Wall -Wextra -Werror \
            tests/macos_pasteboard_test.m -framework AppKit -framework CoreGraphics \
            -framework ImageIO -o target/debug/macos-pasteboard-test
          MTC_CRASH_ON_REPORT=1 \
            DYLD_INSERT_LIBRARIES="$(xcode-select -p)/usr/lib/libMainThreadChecker.dylib" \
            ./target/debug/macos-pasteboard-test
      # The app, the AWDL helper, Sparkle and the icon, in a signed bundle.
      - name: App bundle
        run: ./scripts/build-macos-app.sh --debug
      # Opens the bundle on a fresh configuration: it must stay up with its
      # window on screen. The picture and the log are kept with the run.
      - name: Open the app
        run: |
          mkdir -p target/app-check
          cd target/app-check
          cat > windows.swift <<'SWIFT'
          import CoreGraphics
          let pid = Int(CommandLine.arguments[1])!
          let all = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]] ?? []
          let mine = all.filter { $0[kCGWindowOwnerPID as String] as? Int == pid }
          for window in mine { print(window[kCGWindowBounds as String] ?? "") }
          let big = mine.contains { (($0[kCGWindowBounds as String] as? [String: Any])?["Width"] as? Double ?? 0) >= 700 }
          if !big { print("no zflow window on screen"); exit(1) }
          SWIFT
          RUST_LOG=warn,zflow=debug ../debug/zflow.app/Contents/MacOS/zflow-app \
            --config "$PWD/config/config.toml" --show-settings 2> app.log &
          pid=$!
          sleep 20
          screencapture -x macos.png || true
          kill -0 "$pid" || { cat app.log; exit 1; }
          swift windows.swift "$pid" || { cat app.log; exit 1; }
          kill "$pid"
          wait "$pid" || true
          cat app.log
          ! grep -q panicked app.log
      - name: Upload app check
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zflow-app-check-macos
          path: target/app-check/
          if-no-files-found: ignore
      # install.sh also runs on Macs, with their own tar and checksum tools.
      - name: Installer
        run: python3 tests/install_test.py
      - name: Notarization script
        run: python3 tests/macos_notarization_test.py
      - name: Update packaging
        run: python3 tests/macos_updates_test.py
